version: "3.8"

services:
  backend:
    build:
      context: ./backend
    # container_name: fraud-api
    restart: always
    volumes:
      - ./backend/stats.json:/app/stats.json
      - ./backend/csv_uploads:/app/csv_uploads
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
    container_name: fraud-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: fraud-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
